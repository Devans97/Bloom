<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#fff9fa">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="BLOOM">
  <meta name="description" content="A thoughtful, private CBSE Class XII board study companion for Aastha.">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <title>BLOOM · Your study companion</title>
  <link rel="manifest" href="./manifest.webmanifest">
  <link rel="icon" href="./art/mark.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="./art/icon-180.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Caveat:wght@600;700&family=Kalam:wght@400;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="./style.css">
  <link rel="stylesheet" href="./importer.css">
  <link rel="stylesheet" href="./study-tools.css">
  <link rel="stylesheet" href="./life-tools.css">
  <link rel="stylesheet" href="./motion.css">
  <link rel="stylesheet" href="./vault.css">
  <link rel="stylesheet" href="./academic.css">
  <link rel="stylesheet" href="./academic-learning.css">
  <link rel="stylesheet" href="./onboarding.css">
  <link rel="stylesheet" href="./design-system.css">
  <script>
    // Permanently and aggressively eradicate any floating dock, bottom timer pill, or stale cache
    (function() {
      function killDock() {
        var targets = document.querySelectorAll('#bloom-focus-dock, .focus-dock, [id*="focus-dock"], [id*="dock-timer"], #dock-expand-btn, #dock-minimize-btn, [class*="focus-dock"]');
        for (var i = 0; i < targets.length; i++) {
          targets[i].remove();
        }
        var all = document.querySelectorAll('body > div, body > aside, body > section');
        for (var j = 0; j < all.length; j++) {
          var el = all[j];
          if (el.id === 'app' || el.id === 'dialog' || el.id === 'tour-ui' || el.id === 'notice') continue;
          var t = el.innerText || '';
          if (t.includes('25:00') || t.includes('Ambient:') || t.includes('Search ⌘K')) {
            el.remove();
          }
        }
      }
      killDock();
      if (document.readyState === 'loading') {
        document.addEventListener('DOMContentLoaded', killDock);
      }
      window.addEventListener('load', killDock);
      setInterval(killDock, 150);

      // Force unregister all service workers and wipe all caches
      if ('serviceWorker' in navigator) {
        navigator.serviceWorker.getRegistrations().then(function(regs) {
          for (var i = 0; i < regs.length; i++) {
            regs[i].unregister();
          }
        });
      }
      if ('caches' in window) {
        caches.keys().then(function(keys) {
          for (var i = 0; i < keys.length; i++) {
            caches.delete(keys[i]);
          }
        });
      }
    })();
  </script>
</head>
<body>
  <a class="skip" href="#content">Skip to content</a>
  <div id="app">
    <div class="boot-screen" role="status" aria-live="polite">
      <div class="boot-mark"><img src="./art/mark.svg" alt=""><i></i><i></i><i></i></div>
      <p class="boot-wordmark">BLOOM</p>
      <p class="boot-message">Making space for your next step</p>
      <span class="boot-progress" aria-hidden="true"></span>
    </div>
  </div>
  <dialog id="dialog" aria-labelledby="dialog-title"></dialog>
  <div id="tour-ui" hidden></div>
  <div id="notice" role="status" aria-live="polite"></div>
  <script src="./config.js"></script>
  <script type="module" src="./js/app.bundle.js"></script>
</body>
</html>

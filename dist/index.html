  <script>
    // Permanently eradicate any floating dock or bottom timer pill
    (function() {
      function purgeDock() {
        var targets = document.querySelectorAll('#bloom-focus-dock, .focus-dock, [id*="focus-dock"], [id*="dock-timer"], #dock-expand-btn, #dock-minimize-btn');
        for (var i = 0; i < targets.length; i++) {
          targets[i].remove();
        }
      }
      purgeDock();
      if (document.readyState === 'loading') {
        document.addEventListener('DOMContentLoaded', purgeDock);
      }
      window.addEventListener('load', purgeDock);
      if ('serviceWorker' in navigator) {
        navigator.serviceWorker.getRegistrations().then(function(regs) {
          for (var r of regs) r.update();
        });
      }
    })();
  </script>
</head>
<body>
  <a class="skip" href="#content">Skip to content</a>
  <div id="app">
    <div class="boot-screen" role="status" aria-live="polite">
      <div class="boot-mark"><img src="./art/mark.svg" alt=""><i></i><i></i><i></i></div>
      <p class="boot-wordmark">BLOOM</p>
      <p class="boot-message">Making space for your next step</p>
      <span class="boot-progress" aria-hidden="true"></span>
    </div>
  </div>
  <dialog id="dialog" aria-labelledby="dialog-title"></dialog>
  <div id="tour-ui" hidden></div>
  <div id="notice" role="status" aria-live="polite"></div>
  <script src="./config.js"></script>
  <script type="module" src="./js/app.bundle.js"></script>
</body>
